[workspace]
resolver = "2"
members = [
    "crates/offline-packet",
    "crates/offline-noise",
    "crates/offline-fountain",
    "crates/offline-mesh",
    "crates/offline-core",
    "crates/offline_ffi",
    "crates/offline-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/toto/Offline"
rust-version = "1.75"

[workspace.dependencies]
offline-packet = { path = "crates/offline-packet" }
offline-noise = { path = "crates/offline-noise" }
offline-fountain = { path = "crates/offline-fountain" }
offline-mesh = { path = "crates/offline-mesh" }
offline-core = { path = "crates/offline-core" }

snow = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
rand_core = "0.6"
hex = "0.4"
thiserror = "2"
flate2 = "1"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
web-time = "1.1"

[profile.release]
lto = true
codegen-units = 1
