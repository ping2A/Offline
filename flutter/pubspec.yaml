name: offline
description: Offline mesh chat and optical file transfer
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rust_lib_offline:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  qr: ^3.0.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  file_picker: ^11.0.3
  image: ^4.5.4
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.0
  permission_handler: ^12.0.3
  web: ^1.1.1
  google_fonts: ^8.2.0
  record: ^7.1.1
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  ffigen: ">=8.0.0"

flutter:
  uses-material-design: true
