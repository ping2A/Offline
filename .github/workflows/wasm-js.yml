# Build and test the FRB-free `@offline/core` npm package.
# Publishes to npm on v* tags when NPM_TOKEN is configured.
name: WASM / JS

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  wasm-js:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/offline-core-js
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install JS deps
        run: npm ci || npm install

      - name: Build WASM + TypeScript
        run: npm run build

      - name: Test
        run: npm test

      - name: Check gzipped wasm size budget
        run: |
          set -euo pipefail
          WASM="pkg/offline_wasm_bg.wasm"
          BYTES=$(wc -c < "$WASM")
          GZIP=$(gzip -c "$WASM" | wc -c)
          echo "wasm raw=${BYTES} gzipped=${GZIP}"
          # Target < 350 KiB gzipped (docs/WASM_JS_PACKAGE.md §6).
          if [ "$GZIP" -gt 358400 ]; then
            echo "gzipped wasm exceeds 350 KiB budget: ${GZIP}" >&2
            exit 1
          fi

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
