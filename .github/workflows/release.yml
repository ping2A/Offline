# Build Android APK + iOS archive and attach them to a GitHub Release
# whenever a version tag is pushed (e.g. v0.1.0 or v0.1.0-beta.1).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Stage artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "${GITHUB_WORKSPACE}/dist/Offline-${TAG}-android.apk"
          ls -lh "${GITHUB_WORKSPACE}/dist"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/Offline-*-android.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Offline ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/Offline-*-android.apk
          fail_on_unmatched_files: true

  ios:
    name: iOS archive
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS archive
        # No Apple Distribution cert in CI yet — ship an .xcarchive that can be
        # opened in Xcode and signed locally / via TestFlight later.
        run: flutter build ipa --release --no-codesign

      - name: Stage artifact
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="$(find build/ios/archive -name '*.xcarchive' -print -quit)"
          if [[ -z "${ARCHIVE}" ]]; then
            echo "No .xcarchive found under build/ios/archive" >&2
            find build/ios -maxdepth 3 -type d -print >&2 || true
            exit 1
          fi
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          OUT="${GITHUB_WORKSPACE}/dist/Offline-${TAG}-ios-unsigned.xcarchive.zip"
          ditto -c -k --sequesterRsrc --keepParent "${ARCHIVE}" "${OUT}"
          ls -lh "${GITHUB_WORKSPACE}/dist"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: dist/Offline-*-ios-unsigned.xcarchive.zip
          if-no-files-found: error

      - name: Attach iOS archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Offline ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/Offline-*-ios-unsigned.xcarchive.zip
          fail_on_unmatched_files: true
